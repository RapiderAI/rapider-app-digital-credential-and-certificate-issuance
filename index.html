<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Digital Credential &amp; Certificate Issuance</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/credentials-pulse/credentials-pulse.html"></iframe>
  <script>
    const routes = {
  "credentials-pulse": "pages/credentials-pulse/credentials-pulse.html",
  "artwork-templates": "pages/artwork-templates/artwork-templates.html",
  "issuance-batches": "pages/issuance-batches/issuance-batches.html",
  "stackable-pathways": "pages/stackable-pathways/stackable-pathways.html",
  "ceu-renewals": "pages/ceu-renewals/ceu-renewals.html",
  "learner-wallet": "pages/learner-wallet/learner-wallet.html",
  "public-verifier": "pages/public-verifier/public-verifier.html",
  "issuer-authorities": "pages/issuer-authorities/issuer-authorities.html",
  "verification-analytics": "pages/verification-analytics/verification-analytics.html",
  "assertion-verify-detail": "pages/assertion-verify-detail/assertion-verify-detail.html",
  "artwork-template-detail": "pages/artwork-template-detail/artwork-template-detail.html",
  "batch-issue-drawer": "pages/batch-issue-drawer/batch-issue-drawer.html",
  "issuer-renewal-drawer": "pages/issuer-renewal-drawer/issuer-renewal-drawer.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'credentials-pulse';
      const target = routes[route] || routes['credentials-pulse'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
